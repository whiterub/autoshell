<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 16가지 성격 유형</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .age-btn {
            padding: 12px 25px;
            border: 3px solid #ff6b6b;
            background: white;
            color: #ff6b6b;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .age-btn:hover {
            background: #ff6b6b;
            color: white;
            transform: translateY(-2px);
        }

        .age-btn.active {
            background: #ff6b6b;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .perspective-btn {
            padding: 10px 20px;
            border: 2px solid #4caf50;
            background: white;
            color: #4caf50;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .perspective-btn:hover {
            background: #4caf50;
            color: white;
            transform: translateY(-2px);
        }

        .perspective-btn.active {
            background: #4caf50;
            color: white;
        }

        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .mbti-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mbti-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .mbti-card.analyst {
            border-left: 5px solid #88619A;
        }

        .mbti-card.diplomat {
            border-left: 5px solid #33A474;
        }

        .mbti-card.sentinel {
            border-left: 5px solid #4298B4;
        }

        .mbti-card.explorer {
            border-left: 5px solid #E4AE3A;
        }

        .mbti-type {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .mbti-nickname {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .mbti-category {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 15px;
            font-weight: bold;
            color: white;
        }

        .analyst-tag {
            background: #88619A;
        }

        .diplomat-tag {
            background: #33A474;
        }

        .sentinel-tag {
            background: #4298B4;
        }

        .explorer-tag {
            background: #E4AE3A;
        }

        .mbti-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .mbti-traits {
            margin-top: 15px;
        }

        .trait-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .trait-list {
            list-style: none;
            padding-left: 0;
        }

        .trait-list li {
            padding: 5px 0;
            color: #666;
        }

        .trait-list li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }

        .modal-content {
            background-color: white;
            margin: 50px auto;
            padding: 40px;
            border-radius: 20px;
            max-width: 800px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 2em;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close:hover {
            color: #333;
        }

        .modal-header {
            margin-bottom: 30px;
        }

        .modal-type {
            font-size: 3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .modal-nickname {
            font-size: 1.8em;
            color: #666;
            margin-bottom: 20px;
        }

        .modal-section {
            margin-bottom: 25px;
        }

        .modal-section-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .modal-section-content {
            color: #555;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .mbti-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 20px;
                padding: 25px;
            }

            .modal-type {
                font-size: 2.2em;
            }

            .age-btn {
                font-size: 0.95em;
                padding: 10px 18px;
            }
        }
    </style>
</head>

                    asColleague: '창의적 전문가로서 독특한 관점을 제공합니다. 조용하지만 깊이 있는 기여를 하며, 후배를 지원합니다.',
                    asSubordinate: '자율적으로 일하며 창의적 기여를 합니다. 존중받는 환경에서 전문성을 발휘합니다.',
                    asCEO: '창의성과 인간 중심의 경영을 합니다. 유연하면서도 경험을 바탕으로 안정적인 운영을 합니다.'
                },
                ESTP: {
                    asBoss: '경험과 순발력으로 역동적 리더십을 발휘합니다. 빠른 의사결정과 위기 관리에 뛰어나며, 실용적 솔루션을 제시합니다.',
                    asColleague: '시니어 전문가로서 즉각적 문제 해결을 합니다. 위기 상황에서 리더십을 발휘하며, 실전 경험을 공유합니다.',
                    asSubordinate: '도전적 과제를 선호하며 빠른 실행력을 발휘합니다. 자율성을 유지하면서도 성과를 냅니다.',
                    asCEO: '과감하고 빠른 경영을 합니다. 위기를 기회로 만들며, 경험을 통해 전략적 안목도 갖춥니다.'
                },
                ESFP: {
                    asBoss: '경험과 긍정성으로 활기찬 조직을 만듭니다. 팀원을 격려하고 지원하며, 현장 경험을 바탕으로 실용적 리더십을 발휘합니다.',
                    asColleague: '밝고 협력적인 시니어로서 조직 분위기를 좋게 만듭니다. 현장 감각이 뛰어나며, 후배를 격려합니다.',
                    asSubordinate: '긍정적으로 일하며 팀에 기여합니다. 즐거운 환경을 선호하지만, 경험을 통해 책임감도 높습니다.',
                    asCEO: '사람 중심의 활기찬 문화를 만듭니다. 현장 감각과 빠른 대응력으로 조직을 이끕니다.'
                }
            }
        };

        // 전역 변수
        const modal = document.getElementById('mbtiModal');
        const closeBtn = document.querySelector('.close');

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            renderMBTICards();
            setupFilterButtons();
            setupAgeButtons();
            setupPerspectiveButtons();
            setupModal();
            updateWorkplaceButtonVisibility();
        });

        // 현재 선택된 데이터 가져오기
        function getCurrentMBTIData() {
            return mbtiDataByAge[currentAge];
        }

        // MBTI 카드 렌더링
        function renderMBTICards(filter = 'all') {
            const grid = document.getElementById('mbtiGrid');
            grid.innerHTML = '';

            const mbtiData = getCurrentMBTIData();

            Object.values(mbtiData).forEach(mbti => {
                if (filter === 'all' || mbti.category === filter) {
                    const card = createMBTICard(mbti);
                    grid.appendChild(card);
                }
            });
        }

        // MBTI 카드 생성
        function createMBTICard(mbti) {
            const card = document.createElement('div');
            card.className = `mbti-card ${mbti.category}`;
            card.onclick = () => openModal(mbti);

            card.innerHTML = `
                <div class="mbti-type">${mbti.type}</div>
                <div class="mbti-nickname">${mbti.nickname}</div>
                <div class="mbti-category ${mbti.category}-tag">${mbti.categoryName}</div>
                <div class="mbti-description">${mbti.description}</div>
                <div class="mbti-traits">
                    <div class="trait-title">주요 특징:</div>
                    <ul class="trait-list">
                        ${mbti.traits.slice(0, 3).map(trait => `<li>${trait}</li>`).join('')}
                    </ul>
                </div>
            `;

            return card;
        }

        // 연령대 버튼 설정
        function setupAgeButtons() {
            const ageButtons = document.querySelectorAll('.age-btn');
            ageButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    ageButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    currentAge = this.getAttribute('data-age');
                    updateWorkplaceButtonVisibility();
                    renderMBTICards(currentFilter);
                });
            });
        }

        // 관점 버튼 설정
        function setupPerspectiveButtons() {
            const perspectiveButtons = document.querySelectorAll('.perspective-btn');
            perspectiveButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    perspectiveButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    currentPerspective = this.getAttribute('data-perspective');
                });
            });
        }

        // 직장 관계 버튼 표시/숨김
        function updateWorkplaceButtonVisibility() {
            const workplaceBtn = document.getElementById('workplaceBtn');
            if (currentAge === 'elementary') {
                workplaceBtn.style.display = 'none';
                // 초등학생용에서는 기본 성향으로 전환
                if (currentPerspective === 'workplace') {
                    currentPerspective = 'basic';
                    document.querySelector('.perspective-btn[data-perspective="basic"]').classList.add('active');
                    document.querySelector('.perspective-btn[data-perspective="workplace"]').classList.remove('active');
                }
            } else {
                workplaceBtn.style.display = 'inline-block';
            }
        }

        // 필터 버튼 설정
        function setupFilterButtons() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const filter = this.getAttribute('data-filter');
                    currentFilter = filter;
                    renderMBTICards(filter);
                });
            });
        }

        // 모달 설정
        function setupModal() {
            closeBtn.onclick = function() {
                modal.style.display = 'none';
            }

            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }
        }

        // 모달 열기
        function openModal(mbti) {
            const modalBody = document.getElementById('modalBody');
            let contentHTML = `
                <div class="modal-header">
                    <div class="modal-type">${mbti.type}</div>
                    <div class="modal-nickname">${mbti.nickname}</div>
                    <div class="mbti-category ${mbti.category}-tag">${mbti.categoryName}</div>
                </div>
            `;

            if (currentPerspective === 'basic') {
                // 기본 성향 표시
                contentHTML += `
                    <div class="modal-section">
                        <div class="modal-section-title">성격 설명</div>
                        <div class="modal-section-content">${mbti.description}</div>
                    </div>

                    <div class="modal-section">
                        <div class="modal-section-title">주요 특징</div>
                        <div class="modal-section-content">
                            <ul class="trait-list">
                                ${mbti.traits.map(trait => `<li>${trait}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="modal-section">
                        <div class="modal-section-title">강점</div>
                        <div class="modal-section-content">${mbti.strengths}</div>
                    </div>

                    <div class="modal-section">
                        <div class="modal-section-title">약점</div>
                        <div class="modal-section-content">${mbti.weaknesses}</div>
                    </div>

                    <div class="modal-section">
                        <div class="modal-section-title">추천 직업</div>
                        <div class="modal-section-content">${mbti.careers}</div>
                    </div>
                `;
            } else if (currentPerspective === 'financial') {
                // 재테크 성향 표시
                contentHTML += `
                    <div class="modal-section">
                        <div class="modal-section-title">💰 재테크 성향</div>
                        <div class="modal-section-content">${mbti.financial}</div>
                    </div>
                `;
            } else if (currentPerspective === 'workplace') {
                // 직장 관계 표시
                const workplaceData = workplaceRelationships[currentAge]?.[mbti.type];
                if (workplaceData) {
                    contentHTML += `
                        <div class="modal-section">
                            <div class="modal-section-title">👔 상사로서</div>
                            <div class="modal-section-content">${workplaceData.asBoss}</div>
                        </div>

                        <div class="modal-section">
                            <div class="modal-section-title">🤝 동료로서</div>
                            <div class="modal-section-content">${workplaceData.asColleague}</div>
                        </div>

                        <div class="modal-section">
                            <div class="modal-section-title">📋 부하로서</div>
                            <div class="modal-section-content">${workplaceData.asSubordinate}</div>
                        </div>

                        <div class="modal-section">
                            <div class="modal-section-title">🏢 대표로서</div>
                            <div class="modal-section-content">${workplaceData.asCEO}</div>
                        </div>
                    `;
                } else {
                    contentHTML += `
                        <div class="modal-section">
                            <div class="modal-section-content">직장 관계 데이터가 준비 중입니다.</div>
                        </div>
                    `;
                }
            }

            modalBody.innerHTML = contentHTML;
            modal.style.display = 'block';
        }
    </script>
</body>
</html>
